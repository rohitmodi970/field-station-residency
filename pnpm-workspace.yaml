packages:
  - apps/*
  - packages/*

overrides:
  react: 19.1.0
  react-dom: 19.1.0

peerDependencyRules:
  allowedVersions:
    react: "19"
    react-dom: "19"

allowBuilds:
  canvas: true
  core-js: true
  core-js-pure: true
  esbuild: true
  ffmpeg-static: true
  protobufjs: true
  sharp: true
  supabase: true
  tesseract.js: true
  unrs-resolver: true

nodeLinker: hoisted

minimumReleaseAgeExclude:
  - onairos@8.12.4
